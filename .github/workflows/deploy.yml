name: Build check

# GitHub Pages serves the main branch directly (site at /hunter/, AURUM at /hunter/gold/).
# This job only checks that both apps still compile.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm run build:gold
