name: AURUM data probe
on:
  push:
    branches: [aurum-probe]
permissions:
  contents: write
jobs:
  dump:
    if: "!contains(github.event.head_commit.message, '[skip probe]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dump 180 days of real gold (PAXG M15) and EUR/USDT H1
        run: |
          mkdir -p data
          cat > dump.mjs <<'JS'
          import { writeFileSync } from "fs";
          async function dump(symbol, interval, ms, days, file) {
            const out = new Map();
            let start = Date.now() - days * 864e5;
            for (let g = 0; g < 60 && start < Date.now(); g++) {
              const r = await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=1000&startTime=${start}`);
              const rows = await r.json();
              if (!rows.length) break;
              for (const k of rows) out.set(k[0], [k[0], +k[1], +k[2], +k[3], +k[4], +k[5]]);
              start = rows[rows.length - 1][0] + ms;
              if (rows.length < 1000) break;
            }
            const list = [...out.values()].sort((a, b) => a[0] - b[0]);
            writeFileSync(file, JSON.stringify(list));
            console.log(symbol, interval, list.length, "bougies");
          }
          await dump("PAXGUSDT", "15m", 900e3, 180, "data/paxg-15m.json");
          await dump("EURUSDT", "1h", 3600e3, 190, "data/eurusdt-1h.json");
          JS
          node dump.mjs
      - name: Commit data
        run: |
          git add data
          git -c user.name="AURUM bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Real gold data dump [skip probe]"
          git push -q origin HEAD:aurum-probe
