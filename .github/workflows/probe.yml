name: AURUM data probe
on:
  push:
    branches: [aurum-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe gold data sources
        run: |
          Y=$(date -u -d yesterday +%F)
          NOW=$(date -u +%s)
          probe() { code=$(curl -s -m 15 -o body.txt -w "%{http_code}" "$2"); echo "== $1 -> HTTP $code :: $(head -c 160 body.txt | tr '\n' ' ')"; }
          probe ipinfo "https://ipinfo.io/json"
          probe binance-fapi-XAU "https://fapi.binance.com/fapi/v1/klines?symbol=XAUUSDT&interval=15m&limit=2"
          probe binance-fapi-XAG "https://fapi.binance.com/fapi/v1/klines?symbol=XAGUSDT&interval=1h&limit=2"
          probe binance-dataapi-PAXG "https://data-api.binance.vision/api/v3/klines?symbol=PAXGUSDT&interval=15m&limit=2"
          probe binance-dataapi-EUR "https://data-api.binance.vision/api/v3/klines?symbol=EURUSDT&interval=1h&limit=2"
          probe binance-api-PAXG "https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=15m&limit=2"
          probe binance-vision-zip "https://data.binance.vision/data/futures/um/daily/klines/XAUUSDT/15m/XAUUSDT-15m-$Y.zip"
          probe coinbase-PAXG "https://api.exchange.coinbase.com/products/PAXG-USD/candles?granularity=900"
          probe kraken-PAXG "https://api.kraken.com/0/public/OHLC?pair=PAXGUSD&interval=15"
          probe okx-XAUT "https://www.okx.com/api/v5/market/candles?instId=XAUT-USDT&bar=15m&limit=2"
          probe bitget-XAU "https://api.bitget.com/api/v2/mix/market/candles?symbol=XAUUSDT&productType=USDT-FUTURES&granularity=15m&limit=2"
          probe bybit-XAUT "https://api.bybit.com/v5/market/kline?category=spot&symbol=XAUTUSDT&interval=15&limit=2"
          probe yahoo-GC "https://query1.finance.yahoo.com/v8/finance/chart/GC=F?interval=15m&range=5d"
          probe forexfactory "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
          probe ntfy "https://ntfy.sh/v1/health"
