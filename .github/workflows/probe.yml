name: AURUM data probe
on:
  push:
    branches: [aurum-probe]
permissions:
  contents: write
jobs:
  xau:
    if: "!contains(github.event.head_commit.message, '[skip probe]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe real gold sources
        run: |
          cat > probe.mjs <<'JS'
          const show = (label, x) => console.log(`== ${label}: ${typeof x === "string" ? x : JSON.stringify(x).slice(0, 400)}`);
          const iso = (t) => new Date(+t).toISOString().slice(0, 16);
          async function get(url, origin) {
            const r = await fetch(url, origin ? { headers: { Origin: origin } } : {});
            const txt = await r.text();
            let body; try { body = JSON.parse(txt); } catch { body = txt.slice(0, 200); }
            return { status: r.status, cors: r.headers.get("access-control-allow-origin"), body };
          }
          const B = "https://api.bitget.com/api/v2/mix/market";
          // 1) recent candles, order, count, CORS
          let r = await get(`${B}/candles?symbol=XAUUSDT&productType=USDT-FUTURES&granularity=15m&limit=1000`, "https://ashuto796-boop.github.io");
          const d = r.body.data || [];
          show("bitget candles 15m", { status: r.status, cors: r.cors, n: d.length, first: d[0] && iso(d[0][0]), last: d.at(-1) && iso(d.at(-1)[0]), row: d.at(-1) });
          // 2) going back in time with endTime
          for (const daysAgo of [20, 45, 70, 120]) {
            const end = Date.now() - daysAgo * 864e5;
            r = await get(`${B}/candles?symbol=XAUUSDT&productType=USDT-FUTURES&granularity=15m&limit=1000&endTime=${end}`);
            const x = r.body.data || [];
            show(`candles endTime -${daysAgo}j`, { status: r.status, n: x.length, first: x[0] && iso(x[0][0]), last: x.at(-1) && iso(x.at(-1)[0]), msg: r.body.msg });
            r = await get(`${B}/history-candles?symbol=XAUUSDT&productType=USDT-FUTURES&granularity=15m&limit=200&endTime=${end}`);
            const y = r.body.data || [];
            show(`history-candles endTime -${daysAgo}j`, { status: r.status, n: y.length, first: y[0] && iso(y[0][0]), last: y.at(-1) && iso(y.at(-1)[0]), msg: r.body.msg });
          }
          // 3) silver + 1H granularity name
          r = await get(`${B}/candles?symbol=XAGUSDT&productType=USDT-FUTURES&granularity=1H&limit=5`);
          show("bitget XAG 1H", { status: r.status, n: (r.body.data || []).length, msg: r.body.msg, row: (r.body.data || []).at(-1) });
          // 4) weekend candles (last Saturday)
          const sat = new Date(); sat.setUTCDate(sat.getUTCDate() - ((sat.getUTCDay() + 1) % 7)); sat.setUTCHours(12, 0, 0, 0);
          r = await get(`${B}/candles?symbol=XAUUSDT&productType=USDT-FUTURES&granularity=15m&limit=8&startTime=${+sat}&endTime=${+sat + 2 * 3600e3}`);
          show("week-end samedi midi", { n: (r.body.data || []).length, rows: (r.body.data || []).slice(0, 3) });
          // 5) PAXG vs XAU spread right now
          const p = await get("https://data-api.binance.vision/api/v3/klines?symbol=PAXGUSDT&interval=15m&limit=1");
          show("PAXG close vs XAU close", { paxg: p.body[0]?.[4], xau: d.at(-1)?.[4] });
          // 6) OKX gold perps?
          r = await get("https://www.okx.com/api/v5/public/instruments?instType=SWAP&instFamily=XAU-USDT");
          show("okx XAU swap", { status: r.status, body: r.body });
          JS
          node probe.mjs
