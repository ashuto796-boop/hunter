name: AURUM data probe
on:
  push:
    branches: [aurum-probe]
permissions:
  contents: write
jobs:
  media:
    if: "!contains(github.event.head_commit.message, '[skip probe]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe gold media sources
        run: |
          cat > probe.mjs <<'JS'
          const feeds = {
            "google-en": "https://news.google.com/rss/search?q=gold+price+OR+XAUUSD+when:1d&hl=en-US&gl=US&ceid=US:en",
            "google-fr": "https://news.google.com/rss/search?q=%22cours+de+l%27or%22+OR+%22prix+de+l%27or%22+when:1d&hl=fr&gl=FR&ceid=FR:fr",
            "kitco": "https://www.kitco.com/rss/KitcoNews.xml",
            "fxstreet": "https://www.fxstreet.com/rss/news",
            "investing": "https://www.investing.com/rss/news_11.rss",
            "yahoo-gc": "https://feeds.finance.yahoo.com/rss/2.0/headline?s=GC=F&region=US&lang=en-US",
            "mining": "https://www.mining.com/feed/",
            "cnbc-commod": "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000002",
            "gdelt": "https://api.gdeltproject.org/api/v2/doc/doc?query=%22gold%20price%22&mode=artlist&format=json&maxrecords=50&timespan=24h&sort=datedesc",
            "gdelt-tone": "https://api.gdeltproject.org/api/v2/doc/doc?query=%22gold%20price%22&mode=timelinetone&format=json&timespan=7d",
          };
          for (const [name, url] of Object.entries(feeds)) {
            try {
              const r = await fetch(url, { headers: { "User-Agent": "Mozilla/5.0 (compatible; AURUM/1.0)", Origin: "https://ashuto796-boop.github.io" } });
              const txt = await r.text();
              const items = (txt.match(/<item[\s>]/g) || []).length;
              const titles = [...txt.matchAll(/<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/title>/g)].slice(1, 4).map((m) => m[1].slice(0, 90));
              const gold = (txt.match(/gold|\bor\b|XAU/gi) || []).length;
              console.log(`== ${name}: HTTP ${r.status} cors=${r.headers.get("access-control-allow-origin")} type=${r.headers.get("content-type")} items=${items} goldWords=${gold} size=${txt.length}`);
              if (name.startsWith("gdelt")) console.log("   ", txt.slice(0, 500).replace(/\s+/g, " "));
              else console.log("   ", JSON.stringify(titles));
            } catch (e) { console.log(`== ${name}: ERROR ${e.message}`); }
          }
          JS
          node probe.mjs
