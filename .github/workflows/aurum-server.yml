name: AURUM serveur 24/7

# The gold AI runs here every 15 minutes, phone on or off. Each run replays every closed candle
# since the previous one with the same engine as the app (server/main.ts), then publishes on the
# aurum-data branch: state.json (read by the app), stamp.json (polled by the app) and memory.json
# (every past signal and its outcome, which the AI keeps learning from).
# Settings: server/config.json. Optional push alerts: repository secrets NTFY_TOPIC (ntfy app)
# or TELEGRAM_TOKEN + TELEGRAM_CHAT_ID. Optional evening log written by Claude: ANTHROPIC_API_KEY.
# Optional real-money copy of the AI's trades on Capital.com (server/live.ts): secrets
# CAPITAL_API_KEY, CAPITAL_IDENTIFIER (login e-mail), CAPITAL_PASSWORD (the API key's own password),
# CAPITAL_ENV ("demo" by default, "live" for real money, which also needs the confirmation
# sentence in server/config.json) and AURUM_PASSPHRASE, which seals the account data.
# To start over with a new account: delete aurum-data.
# Each run is a session of about 5 h 40 with a passage every 15 minutes (server/session.sh);
# at its end it starts the next session itself. The hourly schedule only restarts the chain if
# it ever breaks.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the next session

concurrency:
  group: aurum-server
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      HAS_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Load previous state
        run: |
          if git fetch -q origin aurum-data 2>/dev/null; then
            git show FETCH_HEAD:state.json > state.json
            if git show FETCH_HEAD:memory.json > memory.tmp 2>/dev/null; then mv memory.tmp memory.json; else rm -f memory.tmp; echo "Pas encore de mémoire."; fi
            echo "État précédent chargé."
          else
            echo "Premier passage : nouveau compte démo."
          fi

      - name: Install the Claude SDK (evening log only)
        if: env.HAS_CLAUDE == 'true'
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run the AI every 15 minutes
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_ENV: ${{ secrets.CAPITAL_ENV }}
          AURUM_PASSPHRASE: ${{ secrets.AURUM_PASSPHRASE }}
        run: bash server/session.sh

      - name: Start the next session
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/aurum-server.yml/dispatches" \
            -d '{"ref":"main"}' && echo "Session suivante lancée."
