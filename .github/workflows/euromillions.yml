name: EuroMillions Quantum Analytics

on:
  push:
    branches: [main]
    paths: ["euromillions/**", ".github/workflows/euromillions.yml"]
  pull_request:
    paths: ["euromillions/**", ".github/workflows/euromillions.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: euromillions/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: euromillions/backend/requirements*.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Tests (pytest + Hypothesis)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: euromillions/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: euromillions/frontend/package-lock.json
      - run: npm ci
      - name: Vérification des types
        run: npx tsc -b --noEmit
      - name: Tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
