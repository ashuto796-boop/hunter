name: AURUM données du test

# Saves the history downloaded by a run of "AURUM test sur 5 ans (rapide)" on the
# aurum-backtest-data branch (gzipped JSON), so later backtests do not download it again.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Numéro du lancement du test rapide qui a téléchargé les données"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: slice-*
          path: backtest/parts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Join and compress
        run: |
          python3 backtest/merge.py backtest/parts data
          gzip -9 data/*.json
          ls -la data
      - name: Publish
        run: |
          cd data
          git init -q -b aurum-backtest-data
          git add .
          git -c user.name="AURUM bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "AURUM : données du test (lancement ${{ inputs.run_id }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aurum-backtest-data
